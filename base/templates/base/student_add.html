{% extends "index.html" %}
{% block title %} {{ title }} {% endblock %}
{% block content %}
    <div class="forms">
        <form action="" method="post">{% csrf_token %}
            {{ form.as_ul }}
            <input type="submit" value="Submit" />
        </form>
    </div>
    {% if group_id %}
        <a href="{% url 'student_list' group_id %}">Back</a>
    {% else %}
        <a href="{% url 'group_list' %}">Back</a>
    {% endif %}
{% endblock %}
